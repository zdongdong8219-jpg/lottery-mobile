<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>排列3 当日结果</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:3;background:#101827;color:white;padding:14px 16px;box-shadow:0 2px 12px #0002}.bar b{font-size:20px}.bar small{display:block;color:#b9c6dc;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:12px}.notice{background:#fff8dc;border:1px solid #f0d878;border-radius:12px;padding:11px 12px;margin-bottom:12px;color:#705300}.card{background:white;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px #26344a12}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{font-size:17px;margin:0}.tag{font-size:12px;background:#e8f4ec;color:#207544;border-radius:999px;padding:4px 8px}.row{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #eef1f5}.row:first-of-type{border-top:0}.label{font-weight:700;color:#526078}.digits{display:flex;flex-wrap:wrap;gap:6px}.d{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;border-radius:50%;background:#eaf0fa;color:#183d72;font-weight:800}.overall .d{background:#fff0dc;color:#984e00}.codes{display:flex;flex-wrap:wrap;gap:7px}.code{background:#edf7ef;color:#17642d;border-radius:8px;padding:6px 8px;font-weight:700}.muted{color:#78859a;font-size:13px;line-height:1.6}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#165dbe;color:white;font-size:15px;font-weight:700}.link{display:inline-flex;align-items:center;text-decoration:none;background:#e9edf3;color:#344258}.empty{padding:24px 8px;text-align:center;color:#78859a}.bad{background:#fff0f0;color:#a52222;border-color:#efb8b8}@media(max-width:420px){.wrap{padding:9px}.card{padding:12px}.d{width:27px;height:27px}}
</style></head><body><div class="bar"><b>排列3 · 当日快速结果</b><small id="top">正在读取云端结果…</small></div><main class="wrap"><div id="notice" class="notice">只显示云端成品，不在手机上重新计算。</div><section id="content"></section><div class="actions"><button id="refresh" class="btn">立即刷新</button><a class="btn link" href="https://zdongdong8219-jpg.github.io/lottery-mobile/pailie3.html">详细复盘</a></div></main><script>
const GAME="pailie3",INITIAL={"checkedAt":"2026-10-21T01:45:26.628Z","date":"2026-10-21","games":{"fc3d":{"issue":"2026280","date":"2026-10-21","status":"pending"},"pailie3":{"issue":"2026280","date":"2026-10-21","status":"pending"}},"prepared":{}},RAW='https://raw.githubusercontent.com/zdongdong8219-jpg/lottery-mobile/main/model-state.json';let revision='',loading=false,lastFetch=0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digs=a=>(Array.isArray(a)?a:[]).map(d=>'<span class="d">'+esc(d)+'</span>').join('');
function valid(p){return p&&/^20d{5}$/.test(p.issue||'')&&Array.isArray(p.positions)&&p.positions.length===3&&p.positions.every(a=>Array.isArray(a)&&a.length>=8);}
function render(data){const g=data?.games?.[GAME]||{},p=data?.prepared?.[GAME],ok=valid(p);if(!ok){document.getElementById('content').innerHTML='<div class="card empty">云端成品正在生成，页面会自动刷新。</div>';document.getElementById('top').textContent=(g.issue||'今日')+' · '+(g.error||'待更新');return false;}revision=data.checkedAt||'';const replay=!!p.replay,labels=['百位','十位','个位'];let html='<div class="card"><div class="head"><h2>'+(replay?'最近完整结果 ':'今日预测 ')+esc(p.issue)+'期</h2><span class="tag">'+(replay?'昨天完整':'今日已发布')+'</span></div><div class="muted">'+esc(p.date||'')+(p.capturedAt?' · 抓取 '+new Date(p.capturedAt).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'')+'</div></div>';html+='<div class="card"><div class="head"><h2>定位号码</h2></div>'+labels.map((name,i)=>'<div><b>'+name+'</b>'+[5,6,7,8].map(k=>'<div class="row"><span class="label">'+k+'码</span><div class="digits">'+digs(p.positions[i].slice(0,k))+'</div></div>').join('')+'</div>').join('')+'</div>';if(p.overallStatus==='ready')html+='<div class="card overall"><div class="head"><h2>综合池</h2></div>'+[5,6,7,8].map(k=>'<div class="row"><span class="label">'+k+'码</span><div class="digits">'+digs(p.overallPools?.[k])+'</div></div>').join('')+'</div>';else html+='<div class="card empty">综合池来源正在补齐，定位结果已先显示。</div>';html+='<div class="card"><div class="head"><h2>主方案</h2></div><div class="codes">'+(p.candidates||[]).map(x=>'<span class="code">'+esc(x)+'</span>').join('')+'</div></div>';document.getElementById('content').innerHTML=html;document.getElementById('top').textContent=(replay?'今日待发布，当前显示 ': '已更新 ')+p.issue+'期 · 云端 '+new Date(data.checkedAt).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});document.getElementById('notice').textContent=replay?'今天资料尚未齐，先显示昨天完整结果；今天发布后会自动替换。':'今天结果已到，手机页无需重新计算。';return true;}
async function refresh(force=false){if(loading||(!force&&Date.now()-lastFetch<10000))return;loading=true;lastFetch=Date.now();try{const r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();render(d);}catch(e){document.getElementById('notice').classList.add('bad');document.getElementById('notice').textContent='本次网络刷新失败，已保留当前结果；稍后会自动重试。';}finally{loading=false;}}
document.getElementById('refresh').onclick=()=>refresh(true);if(INITIAL)render(INITIAL);refresh(true);setInterval(()=>{if(!document.hidden)refresh()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastFetch>15000)refresh(true)});
</script></body></html>
